name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: ctp-net-core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      # 依赖仓为私有仓时 GITHUB_TOKEN 默认不能跨仓读取——需在 org Settings → Actions →
      # General 开放 accessible repositories，或改用 PAT secret。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile ctp-net-core/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Build
        run: dotnet build ctp-net-core.slnx -c Release
        working-directory: ctp-net-core

      # 纯托管组（reqId 分配器 / GBK 解码）——不加载 ctp_native，Linux runner 可跑。
      # P/Invoke 组由 ctp-net-front 的 loopback E2E 覆盖（真 SDK 当裁判），不在本仓 CI 跑。
      - name: Test
        run: dotnet test ctp-net-core.slnx -c Release --no-build
        working-directory: ctp-net-core

      # 原生产物一致性：导出符号 vs ctp_api.h、MANIFEST sha256（DESIGN.md §6 #8）。
      # 已登记的历史缺口见 scripts/native-known-missing.txt（只告警），新的漂移直接失败。
      - name: Native manifest / exports
        run: bash scripts/check-native.sh
        working-directory: ctp-net-core
